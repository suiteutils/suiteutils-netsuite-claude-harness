name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm test
      - name: Bundled CLI is up to date
        run: |
          npm run build
          git diff --exit-code scripts/nsx.mjs || (echo "scripts/nsx.mjs is stale: run npm run build and commit it" && exit 1)
      - name: Plugin and marketplace manifests are valid
        run: npx -y @anthropic-ai/claude-code plugin validate .
      # The tests need Node 22.6+ (type stripping); on older Nodes, smoke-test the shipped bundle.
      - name: Bundle runs on Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/nsx.mjs version && echo '{}' | node scripts/nsx.mjs hook pre
      - name: Bundle runs on Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: node scripts/nsx.mjs version && echo '{}' | node scripts/nsx.mjs hook pre
